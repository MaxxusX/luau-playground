name: Rebuild Lockfile

on:
  workflow_dispatch:

concurrency:
  group: rebuild-lockfile
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  NODE_ENV: development

defaults:
  run:
    shell: bash
    working-directory: '.'

jobs:
  rebuild_lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            .gitignore
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts/sync-textmate-grammar.mjs
            src/lib/editor/Luau.tmLanguage.json

      - name: Create branch
        run: |
          git switch -c rebuild-lockfile

      - name: Setup PNPM
        uses: pnpm/setup@v2
        with:
          runtime: node
          cache: true
          install: false

      - name: Update Dependencies
        run: pnpm update

      - name: Delete Modules
        run: |
          EMPTYDIR=$(mktemp -d)
          rsync -a --delete $EMPTYDIR/ node_modules/
          rm -f pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --lockfile-only

      - name: Update Vulnerable Packages
        run: pnpm audit --fix=update

      - name: Dedupe Dependencies
        run: pnpm dedupe

      - name: Sync TextMate grammar
        run: pnpm run sync:grammar

      - name: Create PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git add pnpm-lock.yaml
          git add pnpm-workspace.yaml
          git add src/lib/editor/Luau.tmLanguage.json
          git commit -m 'chore(deps): rebuild lockfile'
          git push origin rebuild-lockfile --force
          gh pr create --fill
        env:
          GH_TOKEN: ${{ github.token }}
